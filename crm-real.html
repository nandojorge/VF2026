import { createClient } from 'https://esm.sh/@supabase/supabase-js@2.119.0';

/**
 * Vivus CRM: rules recovered from the Sheets snapshot, VF2026 contracts and approved decisions.
 * Pure, offline module. It never reads credentials, contacts remote services, or changes a source.
 * NOT an authorization boundary: the production server must enforce all mutating operations.
 */
class RuleError extends Error {
  constructor(code,message,details={}) { super(message); this.name='RuleError'; this.code=code; this.details=details; }
}
const fail=(code,message,details)=>{throw new RuleError(code,message,details);};
const required=(value,label)=>typeof value==='string'&&value.trim()?value.trim():fail('REQUIRED',`${label} em falta.`);
const amount=(n,label='Valor')=>Number.isSafeInteger(n)&&n>=0?n:fail('INVALID_MONEY',`${label} deve ser um inteiro não negativo, em cêntimos.`);
const entity=(rows,id,name)=>rows.find(x=>x.id===id)||fail('NOT_FOUND',`${name} não encontrado.`);
function toCents(value) {
  const text=String(value).trim().replace(',','.');
  if(!/^\d+(?:\.\d{1,2})?$/.test(text))fail('INVALID_MONEY','Usa um valor não negativo com até duas casas decimais.');
  const [whole,fraction='']=text.split('.'); return amount(Number(whole)*100+Number(fraction.padEnd(2,'0')));
}
function calendarDate(value) {
  if(!/^\d{4}-\d{2}-\d{2}$/.test(value||''))fail('DATE','Indica uma data válida.');
  const d=new Date(value+'T12:00:00Z');if(!Number.isFinite(d.getTime())||d.toISOString().slice(0,10)!==value)fail('DATE','Indica uma data válida.');
  return value;
}
function addMonths(date,months) {
  calendarDate(date);if(!Number.isInteger(months)||months<1||months>120)fail('MONTHS','Prazo inválido.');
  const [y,m,d]=date.split('-').map(Number), target=new Date(Date.UTC(y,m-1+months,1,12));
  const last=new Date(Date.UTC(target.getUTCFullYear(),target.getUTCMonth()+1,0,12)).getUTCDate();
  target.setUTCDate(Math.min(d,last));return target.toISOString().slice(0,10);
}
function normalizeIdentifier(value) {return String(value??'').trim().replace(/^([0-9]+)\.0+$/,'$1');}
function normalizeEmail(value) {return String(value||'').trim().toLowerCase();}
function normalizePhone(value,country='PT') {
  let s=String(value||'').replace(/[^\d+]/g,'').replace(/^00/,'+');
  if(country==='PT'&&/^\d{9}$/.test(s))s='+351'+s;return s;
}
function contactMatches(contacts,{email,phone,profile},country='PT') {
  const e=normalizeEmail(email),p=normalizePhone(phone,country),social=String(profile||'').toLowerCase().trim();
  return contacts.filter(c=>(c.channels||[]).some(ch=>(e&&ch.kind==='email'&&normalizeEmail(ch.value)===e)||(p&&ch.kind==='phone'&&normalizePhone(ch.value,country)===p)||(social&&ch.kind==='social'&&String(ch.value).trim().toLowerCase()===social)));
}
function validateContact(contact,{contacts=[],sharedConfirmed=false}={}) {
  required(contact.name,'Nome ou identificador');
  const seen=new Set(),preferred=new Set();
  for(const ch of contact.channels||[]) {
    if(!['phone','email','social'].includes(ch.kind))fail('CHANNEL','Tipo de contacto inválido.');
    const val=required(ch.value,'Meio de contacto');
    if(ch.kind==='email'&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(val))fail('EMAIL','Email inválido.');
    const key=ch.kind+':'+(ch.kind==='email'?normalizeEmail(val):ch.kind==='phone'?normalizePhone(val):val.toLowerCase());
    if(seen.has(key))fail('DUPLICATE_CHANNEL','Este meio já existe nesta ficha.');seen.add(key);
    if(ch.owner==='third_party'&&!ch.ownerContactId&&!String(ch.ownerLabel||'').trim())fail('OWNER','Identifica a pessoa a quem pertence o contacto.');
    if(ch.preferred){if(ch.invalid)fail('INVALID_PREFERRED','Um meio inválido não pode ser preferencial.');if(preferred.has(ch.kind))fail('PREFERRED','Escolhe um preferencial por tipo.');preferred.add(ch.kind);}
    const matches=contactMatches(contacts.filter(x=>x.id!==contact.id),{email:ch.kind==='email'?val:null,phone:ch.kind==='phone'?val:null,profile:ch.kind==='social'?val:null});
    if(matches.length&&!sharedConfirmed)fail('SHARED_CONFIRMATION','Já existem fichas com este meio. Confirma se são pessoas diferentes.',{ids:matches.map(c=>c.id)});
  }
  return true;
}
function usableContact(contact) {return (contact.channels||[]).some(c=>!c.invalid&&String(c.value||'').trim());}
function directContact(contact) {return (contact.channels||[]).some(c=>!c.invalid&&['phone','email'].includes(c.kind)&&String(c.value||'').trim());}
function commercialContactAllowed(contact,brand,{requestedByPerson=false,requestEntryId=null}={}) {
  const blocked=(contact.commercialRestrictions||[]).some(x=>x.active&&['all',brand].includes(x.brand));
  return {allowed:!blocked||!!(requestedByPerson&&requestEntryId),restrictionRemains:blocked};
}
function assertUnique(items,label){const ids=items.map(x=>x.id);if(ids.some(x=>!x)||new Set(ids).size!==ids.length)fail('DUPLICATE_ID',`${label}: identificadores repetidos ou vazios.`);}
function receivable(deal,payments) {
  amount(deal.totalCents); assertUnique(payments,'Pagamentos');
  let receipts=0,refunds=0;
  for(const p of payments.filter(p=>p.dealId===deal.id&&!p.voided)) {
    amount(p.amountCents);if(p.amountCents===0)fail('ZERO_PAYMENT','Um movimento tem de ter valor.');
    if(p.kind==='refund')refunds+=p.amountCents;else if(p.kind==='receipt')receipts+=p.amountCents;else fail('PAYMENT_KIND','Tipo de movimento desconhecido.');
  }
  const adjustments=(deal.valueAdjustments||[]).reduce((n,x)=>{if(!Number.isSafeInteger(x.deltaCents))fail('INVALID_ADJUSTMENT','Ajustamento inválido.');return n+x.deltaCents;},0);
  const agreed=deal.totalCents+adjustments;if(agreed<0)fail('NEGATIVE_AGREED','Os ajustamentos excedem a venda.');
  if(refunds>receipts)fail('EXCESS_REFUND','Os reembolsos excedem o recebido.');
  const net=receipts-refunds,due=Math.max(0,agreed-net),credit=Math.max(0,net-agreed);
  return {agreedCents:agreed,receivedCents:receipts,refundedCents:refunds,netCents:net,dueCents:due,creditCents:credit,status:due===0?'Pago':net>0?'Parcial':'Por pagar'};
}
function invoiceState(payment) {
  if(payment.voided)return 'Anulado';
  if(payment.invoiceNumber)return 'Registada';
  if(payment.invoiceRequired===true)return 'Pendente';
  if(payment.invoiceRequired===false)return 'Sem fatura indicada';
  return 'Por verificar';
}
function quota(deal,sessions) {
  if(!Number.isInteger(deal.credits)||deal.credits<0)fail('CREDITS','Número de sessões inválido.');
  assertUnique(sessions,'Sessões');let booked=0,performed=0,charged=0;
  for(const s of sessions.filter(s=>s.dealId===deal.id)) {
    if(s.status==='Confirmada')booked++;
    else if(s.status==='Realizada')performed++;
    else if(s.status==='Cancelada'){if(s.chargeCredit)charged++;}
    else fail('SESSION_STATE','Estado de sessão inválido.');
  }
  const available=deal.credits-booked-performed-charged;
  if(available<0)fail('OVERBOOKED','Existem mais sessões reservadas/utilizadas do que as contratadas.');
  return {contracted:deal.credits,booked,performed,charged,used:performed+charged,available};
}
function isConverted(lead,deals,payments) {
  return deals.some(d=>d.leadId===lead.id&&d.kind!=='assessment'&&!d.cancelled&&receivable(d,payments).dueCents===0&&receivable(d,payments).agreedCents>0);
}
function actionContext(state,action) {
  const t=action.target;
  if(!t||t.type==='free')return {leadId:null,contactId:action.contactId||null,brand:action.brand||null};
  if(t.type==='contact'){const c=entity(state.contacts,t.id,'Contacto');return {leadId:null,contactId:c.id,brand:null};}
  let lead;
  if(t.type==='lead')lead=entity(state.leads,t.id,'Lead');
  else {let dealId=t.id;if(t.type==='payment')dealId=entity(state.payments,t.id,'Pagamento').dealId;else if(t.type==='session')dealId=entity(state.sessions,t.id,'Sessão').dealId;else if(t.type!=='deal')fail('TARGET','Associação inválida.');const d=entity(state.deals,dealId,'Negócio');lead=entity(state.leads,d.leadId,'Lead');}
  return {leadId:lead.id,contactId:lead.contactId,brand:lead.brand};
}
function closureBlockers(state,leadId) {
  entity(state.leads,leadId,'Lead');const result=[];
  for(const a of state.actions.filter(a=>a.status==='Pendente'))if(actionContext(state,a).leadId===leadId)result.push({type:'action',id:a.id,message:a.title});
  for(const d of state.deals.filter(d=>d.leadId===leadId)) {
    const f=receivable(d,state.payments),q=quota(d,state.sessions);
    if(f.dueCents)result.push({type:'debt',id:d.id,amountCents:f.dueCents});
    if(f.creditCents)result.push({type:'credit_to_resolve',id:d.id,amountCents:f.creditCents});
    if(q.booked)result.push({type:'bookings',id:d.id,count:q.booked});
    if(!d.followupClosed)result.push({type:'deal_followup',id:d.id});
    for(const p of state.payments.filter(p=>p.dealId===d.id))if(invoiceState(p)==='Pendente')result.push({type:'invoice',id:p.id});

  return result;
}
function archiveBlockers(state,contactId) {
  entity(state.contacts,contactId,'Contacto');const leadIds=new Set(state.leads.filter(l=>l.contactId===contactId).map(l=>l.id));
  for(const d of state.deals.filter(d=>d.beneficiaryId===contactId))leadIds.add(d.leadId);
  const result=[];
  for(const id of leadIds){const l=entity(state.leads,id,'Lead');if(!l.closed)result.push({type:'open_lead',id});else result.push(...closureBlockers(state,id));}
  for(const a of state.actions.filter(a=>a.status==='Pendente')){const c=actionContext(state,a);if(!c.leadId&&c.contactId===contactId)result.push({type:'contact_action',id:a.id});}

function voucherAvailability(voucher,deal,payments,on) {
  calendarDate(on);calendarDate(voucher.validFrom);calendarDate(voucher.validUntil);
  if(voucher.validUntil<voucher.validFrom)fail('VOUCHER_DATES','Prazo inválido.');
  if(voucher.redeemedAt)return {state:'Em utilização',canRedeem:false,usageExpires:false};
  const paid=receivable(deal,payments).dueCents===0;
  if(on<voucher.validFrom)return {state:'Aguarda início',canRedeem:false};
  if(on>voucher.validUntil)return {state:paid?'Expirado · pago':'Expirado',canRedeem:paid&&!!voucher.adminException};
  return {state:paid?'Disponível':'Aguarda pagamento',canRedeem:paid};

/** Agreed on 2026-11-09: by patient AND brand, across all their opportunities/deals.
 * Partial payments warn; they are not treated as entirely unpaid.
 * Read-only assessment. Authentication and serializable booking belong to the server.

const UNPAID_BOOKING_POLICY = Object.freeze({
  version: '2026-11-09.patient-brand.v1',
  scope: 'patient_brand',
  partialPolicy: 'warn',
  maxUnpaidBeforeApproval: 2,

function bookingPatient(state, deal) {
  const lead=entity(state.leads,deal.leadId,'Lead');
  const voucher=(state.vouchers||[]).find(v=>v.dealId===deal.id);

function upgrade(state){
 const s=state&&state.version===2?state:seed();
 s.revision??=0;s.commands??=[];s.audit??=[];s.bookingApprovals??=[];s.honoraria??=[];s.bonuses??=[];s.retentions??=[];
 for(const l of s.leads){l.history??=[];l.notes??=[];l.closed=!!l.closed;}
 for(const d of s.deals){d.valueAdjustments??=[];d.notes??=[];d.followupClosed=!!d.followupClosed;d.brand??=s.leads.find(l=>l.id===d.leadId)?.brand;d.product??=d.label;d.sellerId??=d.professionalId||'p_ana';}
 for(const e of s.entries){e.history??=[];e.linkedLeadIds??=[];e.reviewedValid??=e.state==='processed';}
 for(const ss of s.sessions)ss.scheduleHistory??=[];
 auditState(s);return s;
}
function load(){return seed()}

function save(){if(!REAL_MODE)localStorage.setItem(STORE,JSON.stringify(db))}
function execute(operation,fn,message='Guardado.'){
 if(REAL_MODE){alert('Dados reais em modo de validação. A edição ainda não está ativa nesta fase.');return null}
 try{const out=command(db,ctx(operation),fn);db=out.state;save();ui.modal=null;toast(message);render();return out.result}catch(e){handleError(e);return null}
}
function executeCore(operation,call,message='Guardado.'){
 if(REAL_MODE){alert('Dados reais em modo de validação. A edição ainda não está ativa nesta fase.');return null}
 try{const out=call(ctx(operation));db=out.state;save();ui.modal=null;toast(message);render();return out.result}catch(e){handleError(e);return null}
}
function handleError(e){console.error(e);alert(e?.message||String(e))}

function entityName(action){const c=actionContext(db,action);return contactBy(c.contactId)?.name||'Geral'}
function leadDeals(id){return db.deals.filter(d=>d.leadId===id)}
function paymentSummary(d){return receivable(d,db.payments)}
function dealQuota(d){return quota(d,db.sessions)}
function pendingActionsForLead(id){return db.actions.filter(a=>a.status==='Pendente'&&actionContext(db,a).leadId===id)}
function processActionsForDeal(id){return db.actions.filter(a=>{if(a.status!=='Pendente')return false;if(a.target?.type==='deal'&&a.target.id===id)return true;if(a.target?.type==='session')return db.sessions.some(s=>s.id===a.target.id&&s.dealId===id);if(a.target?.type==='payment')return db.payments.some(p=>p.id===a.target.id&&p.dealId===id);return false})}
function preferred(contact,kind){return (contact?.channels||[]).find(c=>c.kind===kind&&c.preferred&&!c.invalid)||(contact?.channels||[]).find(c=>c.kind===kind&&!c.invalid)||null}
function commercialRestrictionsText(c){return (c.commercialRestrictions||[]).filter(x=>x.active).map(x=>x.brand==='all'?'Ambas as marcas':x.brand).join(', ')}

function leadResponsibleForm(l){return `<form data-form="leadResponsible" data-id="${l.id}">${selectField('responsibleId','Responsável',db.professionals.filter(p=>p.active).map(p=>[p.id,p.name]),l.responsibleId)}<div class="notice">As ações pendentes deste processo serão transferidas. Ações concluídas preservam o executor.</div>${formActions('Alterar responsável')}</form>`}
function archiveBlockedView(c){const b=archiveBlockers(db,c.id);return `<div class="notice danger"><b>Não é possível arquivar.</b> Todas as leads têm de estar encerradas e as restantes pendências resolvidas.</div><ul class="blockers">${b.map(x=>`<li>${esc(blockerText(x))}</li>`).join('')}</ul><div class="modal-actions"><button type="button" class="btn" data-act="modalClose">Fechar</button></div>`}

function openBlocker(type,id){
 if(type==='action'||type==='contact_action'){ui.page='actions';ui.modal=null;ui.actionFilter='Pendente';render();return;}
 if(['debt','credit_to_resolve','bookings','deal_followup'].includes(type)){ui.page='deal';ui.selected=id;ui.modal=null;render();return;}
 if(type==='invoice'){const p=paymentBy(id);if(p){ui.page='deal';ui.selected=p.dealId;ui.modal=null;render();}return;}
 if(type==='open_lead'){ui.page='lead';ui.selected=id;ui.modal=null;render();return;}
}
function mergeContactsData(d,targetId,sourceId,useSourcePrimary=false){
 const target=d.contacts.find(c=>c.id===targetId),source=d.contacts.find(c=>c.id===sourceId);if(!target||!source)throw new RuleError('NOT_FOUND','Contacto não encontrado.');if(useSourcePrimary){for(const k of ['name','city','country','birthDate'])if(source[k])target[k]=source[k];}
 const used=new Set((target.channels||[]).map(c=>`${c.kind}:${c.kind==='email'?normalizeEmail(c.value):c.kind==='phone'?normalizePhone(c.value):String(c.value).trim().toLowerCase()}`));
 for(const ch of source.channels||[]){const key=`${ch.kind}:${ch.kind==='email'?normalizeEmail(ch.value):ch.kind==='phone'?normalizePhone(ch.value):String(ch.value).trim().toLowerCase()}`;if(!used.has(key)){target.channels.push({...ch,id:uid('ch')});used.add(key)}}
 target.commercialRestrictions=[...(target.commercialRestrictions||[]),...(source.commercialRestrictions||[])].filter((x,i,a)=>a.findIndex(y=>y.brand===x.brand&&y.active===x.active&&y.note===x.note)===i);
 for(const l of d.leads)if(l.contactId===sourceId)l.contactId=targetId;
 for(const e of d.entries)if(e.linkedContactId===sourceId)e.linkedContactId=targetId;
 for(const s of d.sessions)if(s.contactId===sourceId)s.contactId=targetId;
 for(const deal of d.deals)if(deal.beneficiaryId===sourceId)deal.beneficiaryId=targetId;
 for(const v of d.vouchers)if(v.beneficiaryId===sourceId)v.beneficiaryId=targetId;
 for(const a of d.actions)if(a.target?.type==='contact'&&a.target.id===sourceId)a.target.id=targetId;
 target.archived=target.archived&&source.archived;target.mergeHistory??=[];target.mergeHistory.push({at:now(),sourceId,sourceName:source.name,by:ACTOR.name});
 d.contacts=d.contacts.filter(c=>c.id!==sourceId);return {contactId:targetId};
}
function createHonorariumForSession(d,s){
 if((d.honoraria||[]).some(h=>h.sessionId===s.id))return;
 const deal=d.deals.find(x=>x.id===s.dealId),prof=d.professionals.find(x=>x.id===s.physioId);if(!deal||!prof||prof.internal)return;
 let q;try{q=quoteFee({tableId:prof.feeTableId,product:deal.product,totalCents:receivable(deal,d.payments).agreedCents,internal:prof.internal,tables:d.feeRules})}catch(e){q={missing:true,grossCents:null}}
 d.honoraria.push({id:uid('hon'),sessionId:s.id,professionalId:prof.id,tableId:prof.feeTableId,grossCents:q.grossCents||0,missing:!!q.missing,status:'aberto',createdAt:now(),frozen:true});
}
function recalcConversion(d,leadId){const l=d.leads.find(x=>x.id===leadId);if(!l)return;const converted=isConverted(l,d.deals,d.payments);if(converted&&l.status!=='Convertida'){l.status='Convertida';l.conversionSource='auto_paid_treatment';l.convertedAt=now();}else if(!converted&&l.status==='Convertida'&&l.conversionSource==='auto_paid_treatment'){l.status='Em Contacto';l.conversionSource=null;l.convertedAt=null;}}
function channelFromEntry(e){const out=[];if(e.phone)out.push({id:uid('ch'),kind:'phone',value:e.phone,preferred:true,owner:'self',invalid:false});if(e.email)out.push({id:uid('ch'),kind:'email',value:e.email,preferred:!out.length,owner:'self',invalid:false});if(e.social)out.push({id:uid('ch'),kind:'social',value:e.social,preferred:!out.length,owner:'self',invalid:false});return out}

function fallbackCopy(text){const t=document.createElement('textarea');t.value=text;t.setAttribute('readonly','');t.style.position='fixed';t.style.opacity='0';document.body.appendChild(t);t.select();try{document.execCommand('copy');toast('Código copiado.')}catch{toast('Seleciona o código e copia manualmente.')}t.remove();}

 if(e.id==='brandFilter'){ui.brand=e.value;ui.selected=null;return render()}
 if(e.id==='actionFilter'){ui.actionFilter=e.value;return render()}
 if(e.id==='genericFilter'){ui.filter=e.value;return render()}
 if(e.id==='agendaStatus'){ui.agendaStatus=e.value;return render()}
 if(e.id==='agendaDate'){ui.agendaDate=e.value;return render()}
 if(e.matches('[data-dynamic="entryContactMode"]')){ui.draft.entryContactMode=e.value;return renderModalOnly()}
 if(e.matches('[data-dynamic="entryContact"]')){ui.draft.entryContactId=e.value;ui.draft.entryLeadMode='';ui.draft.entryLeadId='';return renderModalOnly()}
 if(e.matches('[data-dynamic="entryLeadMode"]')){ui.draft.entryLeadMode=e.value;return renderModalOnly()}
 if(e.matches('[data-dynamic="actionTarget"]')){const form=e.closest('form'),fd=new FormData(form),draft=Object.fromEntries(fd);modal(form.dataset.form==='actionEdit'?'Editar ação':'Nova ação',actionForm(e.value,'',form.dataset.form==='actionEdit'?db.actions.find(a=>a.id===form.dataset.id):null,draft));return}
 if(e.matches('[data-dynamic="dealLead"]')){return modal('Novo negócio',dealForm(e.value))}
 if(e.matches('[data-dynamic="dealCatalog"]')){const f=e.closest('form'),parts=e.value.split('|');for(const [name,val] of [['label',parts[0]],['zone',parts[1]],['amount',String(Number(parts[2])/100)],['credits',parts[3]],['kind',parts[4]]]){const x=f.elements[name];if(x)x.value=val}return}
 if(e.matches('[data-dynamic="sessionDeal"]')){return modal('Marcar sessão',sessionForm(e.value))}
 if(e.matches('[data-dynamic="bonus"]')){const f=e.closest('form'),fd=new FormData(f);return modal('Novo prémio',bonusForm(String(fd.get('sellerId')||''),String(fd.get('ruleId')||'')))}
}
function renderModalOnly(){const e=db.entries.find(x=>x.id===ui.modal?.meta?.entryId)||db.entries.find(x=>x.state==='pending'&&ui.modal?.title==='Tratar entrada');if(ui.modal?.title==='Tratar entrada'&&e){ui.modal.body=entryProcessForm(e)}render()}

function parseAmount(value){const n=String(value??'').trim().replace(',','.');if(!n||!Number.isFinite(Number(n)))throw new RuleError('INVALID_MONEY','Indica um valor válido.');return Math.round(Number(n)*100)}
function formDataObj(form){return new FormData(form)}
function addLeadNote(d,leadId,text,{original=false,source='team',entryId=null}={}){const l=d.leads.find(x=>x.id===leadId);if(!l||!String(text||'').trim())return; l.notes??=[];l.notes.push({id:uid('note'),at:now(),author:original?'Formulário':ACTOR.name,text:String(text).trim(),original,source,entryId});}
function leadHistory(d,leadId,text){const l=d.leads.find(x=>x.id===leadId);if(l){l.history??=[];l.history.push({at:now(),text})}}

function handleSubmit(ev){const form=ev.target.closest('form[data-form]');if(!form)return;ev.preventDefault();const fd=formDataObj(form),kind=form.dataset.form,id=form.dataset.id;
 try{
  if(kind==='contact'){
   const channels=channelsFromForm(fd),contact={id:id||uid('c'),name:String(fd.get('name')||'').trim(),channels,city:String(fd.get('city')||'').trim(),country:String(fd.get('country')||'PT').trim(),birthDate:String(fd.get('birthDate')||''),archived:id?contactBy(id)?.archived:false,commercialRestrictions:[],createdAt:id?contactBy(id)?.createdAt:today()};
   if(fd.has('blockVivus'))contact.commercialRestrictions.push({brand:'VivusFisio',active:true,note:String(fd.get('restrictionNote')||'').trim()});if(fd.has('blockJulya'))contact.commercialRestrictions.push({brand:'Julya',active:true,note:String(fd.get('restrictionNote')||'').trim()});
   validateContact(contact,{contacts:db.contacts.filter(c=>c.id!==id),sharedConfirmed:fd.has('sharedConfirmed')});
   return execute(id?'contact.edit':'contact.create',d=>{if(id){const old=d.contacts.find(c=>c.id===id);Object.assign(old,contact);return {contactId:id}}d.contacts.push(contact);return {contactId:contact.id}},id?'Contacto atualizado.':'Contacto criado.');
  }
  if(kind==='contactArchive')return executeCore('contact.archive',c=>archiveContact(db,id,c),'Contacto arquivado.');
  if(kind==='contactMerge'){const source=String(fd.get('sourceId'));if(!source||source===form.dataset.target)throw new RuleError('MERGE','Escolhe outra ficha.');return execute('contact.merge',d=>mergeContactsData(d,form.dataset.target,source,String(fd.get('primary'))==='source'),'Fichas consolidadas. Histórico preservado.');}
  if(kind==='lead'){
   const lead={id:uid('l'),contactId:String(fd.get('contactId')),brand:String(fd.get('brand')),responsibleId:String(fd.get('responsibleId')),status:String(fd.get('status')),createdAt:today(),origin:{source:String(fd.get('source')||'Manual'),campaign:''},history:[{at:now(),text:'Lead criada manualmente.'}],notes:[]};
   if(String(fd.get('note')||'').trim())lead.notes.push({id:uid('note'),at:now(),author:ACTOR.name,text:String(fd.get('note')).trim(),original:false,source:'team'});
   const manualContact=contactBy(lead.contactId),restriction=manualContact&&commercialContactAllowed(manualContact,lead.brand);
   if(restriction&&!restriction.allowed){if(!confirm(`Este contacto pediu para não receber contactos comerciais da ${lead.brand}. Confirma que este novo pedido foi iniciado pela própria pessoa?`))return;lead.origin.requestedByPerson=true;lead.history.push({at:now(),text:'Novo pedido iniciado pela própria pessoa; restrição comercial mantida.'});}
   return execute('lead.create',d=>{if(!['VivusFisio','Julya'].includes(lead.brand))throw new RuleError('BRAND','Seleciona a marca.');const c=d.contacts.find(x=>x.id===lead.contactId);if(!c)throw new RuleError('CONTACT','Contacto inexistente.');c.archived=false;d.leads.push(lead);const title=String(fd.get('actionTitle')||'').trim();if(title)d.actions.push({id:uid('a'),title,type:String(fd.get('actionType')),dueDate:String(fd.get('actionDate')||today()),responsibleId:lead.responsibleId,status:'Pendente',target:{type:'lead',id:lead.id},note:''});return {leadId:lead.id}},'Lead criada.');
  }
  if(kind==='leadStatus')return execute('lead.status',d=>{const l=d.leads.find(x=>x.id===id);l.status=String(fd.get('status'));return {leadId:id,status:l.status}},'Estado atualizado.');
  if(kind==='leadResponsible')return execute('lead.responsible',d=>{const l=d.leads.find(x=>x.id===id),to=String(fd.get('responsibleId'));const from=l.responsibleId;l.responsibleId=to;for(const a of d.actions)if(a.status==='Pendente'&&actionContext(d,a).leadId===id)a.responsibleId=to;leadHistory(d,id,`Responsável alterado de ${teamName(d,from)} para ${teamName(d,to)}.`);return {leadId:id}},'Responsável e ações pendentes atualizados.');
  if(kind==='leadClose'){const final=String(fd.get('finalStatus'));if(!['Convertida','Não Convertida'].includes(final))throw new RuleError('STATUS','Resultado inválido.');const reason=String(fd.get('reason')||'').trim();if(!reason)throw new RuleError('REQUIRED','Motivo em falta.');return execute('lead.close',d=>{const l=d.leads.find(x=>x.id===id);if(!l||l.closed)throw new RuleError('LEAD','A lead já está encerrada ou não existe.');const blockers=closureBlockers(d,id);if(blockers.length)throw new RuleError('LEAD_PENDING','Resolve as pendências antes de encerrar.',{blockers});l.status=final;l.closed=true;l.closeReason=reason;l.closedAt=now();l.awaitingManualClosure=false;return {leadId:id}},'Lead encerrada.');}
  if(kind==='leadReopen')return executeCore('lead.resume',c=>resumeCredits(db,String(fd.get('dealId')),{confirmed:true},c),'Lead reaberta e contacto retirado do arquivo.');
  if(kind==='leadNote')return execute('lead.note',d=>{addLeadNote(d,id,String(fd.get('note')||''));return {leadId:id}},'Nota adicionada.');

function processEntrySubmit(form,fd){const id=form.dataset.id,e=db.entries.find(x=>x.id===id);if(!e||e.state!=='pending')throw new RuleError('ENTRY','A entrada já foi tratada.');return execute('entry.process',d=>{const entry=d.entries.find(x=>x.id===id);let contactId;if(String(fd.get('contactMode'))==='existing'){contactId=String(fd.get('contactId'));const existing=d.contacts.find(c=>c.id===contactId);if(!existing)throw new RuleError('CONTACT','Escolhe o contacto.');const permission=commercialContactAllowed(existing,entry.brand,{requestedByPerson:true,requestEntryId:entry.id});if(!permission.allowed)throw new RuleError('CONTACT_RESTRICTION','Este pedido não pode gerar seguimento comercial.')}else{const c={id:uid('c'),name:String(fd.get('name')||entry.senderName).trim(),channels:channelFromEntry(entry),city:'',country:'PT',birthDate:'',archived:false,commercialRestrictions:[],createdAt:today()};validateContact(c,{contacts:d.contacts,sharedConfirmed:fd.has('sharedConfirmed')});d.contacts.push(c);contactId=c.id}let leadId;if(String(fd.get('leadMode'))==='existing'){leadId=String(fd.get('leadId'));const l=d.leads.find(l=>l.id===leadId&&l.contactId===contactId&&!l.closed&&l.brand===entry.brand);if(!l)throw new RuleError('LEAD','Escolhe uma lead aberta da marca da entrada.')}else{const l={id:uid('l'),contactId,brand:entry.brand,responsibleId:String(fd.get('responsibleId')),status:'Por Contactar',closed:false,createdAt:today(),origin:{source:entry.source,campaign:entry.campaign,ids:clone(entry.ids||{})},history:[{at:now(),text:`Lead criada a partir de ${entry.source}.`}],notes:[]};d.contacts.find(c=>c.id===contactId).archived=false;d.leads.push(l);leadId=l.id;d.actions.push({id:uid('a'),title:String(fd.get('actionTitle')).trim(),type:String(fd.get('actionType')),dueDate:String(fd.get('actionDate')),responsibleId:l.responsibleId,status:'Pendente',target:{type:'lead',id:leadId},note:''})}entry.state='processed';entry.reviewedValid=true;entry.processedAt=now();entry.linkedContactId=contactId;entry.linkedLeadIds=[...new Set([...(entry.linkedLeadIds||[]),leadId])];entry.history.push({at:now(),text:`Associada ao contacto ${contactId} e lead ${leadId}.`,by:ACTOR.name});addLeadNote(d,leadId,entry.message,{original:true,source:'form',entryId:entry.id});addLeadNote(d,leadId,String(fd.get('note')||''));return {entryId:id,contactId,leadId}},'Entrada processada.');}
function entryLinkSubmit(form,fd,correct){const id=form.dataset.id;return execute(correct?'entry.correct':'entry.link',d=>{const e=d.entries.find(x=>x.id===id),newId=String(fd.get('newLeadId')),newLead=d.leads.find(l=>l.id===newId);if(!e||!newLead||newLead.brand!==e.brand||(!correct&&newLead.contactId!==e.linkedContactId))throw new RuleError('LEAD','Associação inválida.');if(correct){const old=String(fd.get('oldLeadId'));e.linkedLeadIds=(e.linkedLeadIds||[]).filter(x=>x!==old);const oldLead=d.leads.find(l=>l.id===old);if(oldLead)oldLead.notes=(oldLead.notes||[]).filter(n=>!(n.original&&n.entryId===e.id));e.linkedContactId=newLead.contactId;}if(!(e.linkedLeadIds||[]).includes(newId))e.linkedLeadIds.push(newId);if(!(newLead.notes||[]).some(n=>n.original&&n.entryId===e.id))addLeadNote(d,newId,e.message,{original:true,source:'form',entryId:e.id});e.history.push({at:now(),text:correct?'Associação corrigida manualmente.':'Associada a outra lead.',by:ACTOR.name});return {entryId:id}},correct?'Associação corrigida.':'Entrada associada a outra lead.');}
function makeVoucherCode(brand){const prefix=brand==='Julya'?'JUL':'VIV',chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';for(let k=0;k<100;k++){let x='';for(let i=0;i<12;i++)x+=chars[Math.floor(Math.random()*chars.length)];const code=`${prefix}-${x.slice(0,4)}-${x.slice(4,8)}-${x.slice(8)}`;if(!db.vouchers.some(v=>v.code===code))return code}throw new RuleError('CODE','Não foi possível gerar o código.');}
