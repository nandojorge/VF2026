<style>
:root{font:14px/1.5 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#263b43;background:#f5f7f8;--ink:#263b43;--muted:#71828a;--line:#dfe6e8;--accent:#275f6d;--soft:#edf3f4;--danger:#93473f;--ok:#3c7357;--warn:#946a2d}
*{box-sizing:border-box}body{margin:0;background:#f5f7f8}button,input{font:inherit}button{cursor:pointer}.shell{display:grid;grid-template-columns:224px 1fr;min-height:100vh}.side{background:#20363d;color:#dce8eb;padding:22px 14px;position:sticky;top:0;height:100vh}.logo{font-size:20px;font-weight:800;padding:4px 10px 18px}.logo span{color:#94b6be;font-weight:500}.nav button{width:100%;border:0;background:transparent;color:#c7d7db;text-align:left;padding:10px 11px;border-radius:8px;margin:2px 0}.nav button:hover,.nav button.active{background:#31515b;color:white}.side-note{position:absolute;bottom:18px;left:18px;right:18px;font-size:10px;color:#8fa7ad}.main{min-width:0}.topbar{background:white;border-bottom:1px solid var(--line);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;gap:14px;position:sticky;top:0;z-index:5}.topbar h1{font-size:18px;margin:0}.content{padding:24px;max-width:1500px;margin:auto}.heading{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:18px}.heading h2{margin:0;font-size:25px;letter-spacing:-.5px}.heading p{margin:5px 0 0;color:var(--muted)}.btn{border:1px solid #d6e0e2;background:white;color:#365861;border-radius:8px;padding:8px 11px;font-weight:650;min-height:36px}.btn:hover{background:#f1f6f7}.btn.primary{background:var(--accent);color:white;border-color:var(--accent)}.btn.danger{color:var(--danger);border-color:#e5c3bf}.btn.sm{font-size:11px;padding:6px 9px;min-height:30px}.btn:disabled{opacity:.45;cursor:not-allowed}.panel{background:white;border:1px solid var(--line);border-radius:12px}.pad{padding:18px}.grid{display:grid;gap:16px}.grid.cols4{grid-template-columns:repeat(4,1fr)}.stat{background:white;border:1px solid var(--line);border-radius:12px;padding:16px}.stat span{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.6px}.stat strong{font-size:24px}.section{margin-top:18px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}.section-head h3{margin:0;font-size:16px}.table-wrap{overflow:auto;max-height:70vh}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:11px 12px;border-bottom:1px solid #edf1f2;text-align:left;vertical-align:top;white-space:nowrap}.table th{font-size:10px;color:#7c8d94;text-transform:uppercase;letter-spacing:.45px;position:sticky;top:0;background:#fff;z-index:2}.table tr:hover td{background:#fafcfc}.muted{color:var(--muted)}.small{font-size:11px}.tag{display:inline-block;border-radius:999px;padding:3px 7px;font-size:10px;background:#edf1f2;color:#5d7078}.tag.ok{background:#e8f3ec;color:#397052}.tag.warn{background:#fff3df;color:#8b652e}.tag.info{background:#e8f2f5;color:#3e6f7c}.tag.danger{background:#f8e9e7;color:#8d463f}.filters{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px}.filters input{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:white;min-width:300px}.notice{background:#eef4f5;border:1px solid #d9e5e7;border-radius:9px;padding:11px 13px;color:#547078}.notice.warn{background:#fff7e9;border-color:#efdfbc;color:#87622f}.notice.ok{background:#edf6f0;border-color:#d4e8da;color:#41705a}.notice.danger{background:#fff0ef;border-color:#ebd0cd;color:#8e4943}.empty{padding:34px;text-align:center;color:#7c8d94}.pagination{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0}.right{display:flex;gap:8px;align-items:center}.upload{border:1px dashed #a8bdc2;border-radius:12px;padding:22px;background:#f8fbfb}.upload input{display:block;margin:12px 0}.progress{height:7px;background:#e5edef;border-radius:999px;overflow:hidden}.progress>i{display:block;height:100%;background:#4f7c87;width:0;transition:width .2s}.login{min-height:100vh;display:grid;place-items:center;padding:24px;background:#eef3f4}.login-card{width:min(430px,100%);background:white;border:1px solid var(--line);border-radius:16px;padding:28px;box-shadow:0 18px 70px #18313c18}.login-card h1{margin:0 0 4px}.login-card p{color:var(--muted);margin:0 0 20px}.field{margin:12px 0}.field label{display:block;font-size:11px;font-weight:700;margin-bottom:5px}.field input{width:100%;border:1px solid #cfdcdf;border-radius:8px;padding:10px;background:white}.login-error{color:var(--danger);font-size:12px;margin-top:10px}.user{font-size:11px;color:var(--muted);max-width:260px;overflow:hidden;text-overflow:ellipsis}.loading{min-height:55vh;display:grid;place-items:center;color:var(--muted)}dialog{border:1px solid var(--line);border-radius:14px;padding:0;max-width:760px;width:calc(100% - 30px);box-shadow:0 22px 90px #17333d33}dialog::backdrop{background:#20323c66}.modal-head{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px}.modal-head h3{margin:0}.modal-body{padding:20px;max-height:75vh;overflow:auto}.kv{display:grid;grid-template-columns:180px 1fr;gap:7px 14px;padding:7px 0;border-bottom:1px solid #edf1f2}.kv b{font-size:11px;color:#6d8088}.kv div{white-space:pre-wrap;overflow-wrap:anywhere}.mobile-menu{display:none}
@media(max-width:900px){.shell{grid-template-columns:1fr}.side{display:none;position:fixed;z-index:20;width:230px}.side.open{display:block}.mobile-menu{display:inline-block}.content{padding:16px}.topbar{padding:10px 14px}.grid.cols4{grid-template-columns:1fr 1fr}.heading{flex-direction:column}.filters input{min-width:100%;width:100%}.kv{grid-template-columns:1fr}.user{display:none}}
@media(max-width:520px){.grid.cols4{grid-template-columns:1fr}}
</style>

<body>
<div id="app"></div>
<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2.119.0';

const SUPABASE_URL='https://zrqjusfmgtvneqhpkjxs.supabase.co';
const SUPABASE_KEY='sb_publishable_gdZT4r29BaKKTsns8OVb6Q_cxsDjMCz';
const APP_URL='https://nandojorge.github.io/VF2026/crm-real.html';
const SOURCE_ID='1ncCxxt5PEp6OXk8lRKo9uPhQYbhe8Ri3zeTbpBjyD1Y';
const SOURCE_URL='https://docs.google.com/spreadsheets/d/'+SOURCE_ID+'/edit';
const SOURCE_EXPORT='https://docs.google.com/spreadsheets/d/'+SOURCE_ID+'/export?format=xlsx';
const EXPECTED_SHEETS=['entradas','contadores','contactos','acoes','leads','notasleads','negocios','sessoes','pagamentos','honorarios','premiosabertos','premios','tabelanegociospremio','retencoes','concelhos','Tabelas','expressoes','tabela de preços','listafisioterapeutas','App: Metadata','googlesheets'];

const supabase=createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
const app=document.getElementById('app');
const state={session:null,user:null,member:null,currentRun:null,lastSuccess:null,meta:{},cache:new Map(),page:'dashboard',query:'',pageNo:1,pageSize:50,loading:false,menu:false,detail:null,syncing:false,syncText:'',syncPct:0};

const views={
 entradas:{label:'Entradas',sheet:'entradas',cols:['codigoentrada','data','nomecompleto','origemcontacto','acao','registado','lead_status']},
 contactos:{label:'Contactos',sheet:'contactos',cols:['codigocontacto','nome','concelho','email','telefone','origemcontacto','arquivado']},
 leads:{label:'Leads',sheet:'leads',cols:['codigolead','codigocontacto','nome','servico','datacontactolead','estadodalead','conversao','arquivado']},
 acoes:{label:'Ações',sheet:'acoes',cols:['codigoacao','codigocontacto','nome','acao','dataaco','estado','menu','arquivado']},
 negocios:{label:'Negócios',sheet:'negocios',cols:['codigonegocios','codigolead','nome','negocio','servico','fisioterapeuta','valor','estadonegocio','estadonegociopagamento','arquivado']},
 agenda:{label:'Agenda',sheet:'sessoes',cols:['codigosessao','nome','negocio','fisioterapeuta','data','horasessao','estadosessao']},
 financeiro:{label:'Financeiro',sheet:'pagamentos',cols:['codigopagamentos','nome','negocio','valor','datapagamento','conta','estadopagamento','numerofatura']},
 honorarios:{label:'Honorários',sheet:'honorarios',cols:['codigohonorario','nome','negocio','fisioterapeuta','valorapagar','estado','datapagamento']}
};

const nav=[['dashboard','Dashboard'],['entradas','Entradas'],['contactos','Contactos'],['leads','Leads'],['acoes','Ações'],['negocios','Negócios'],['agenda','Agenda'],['financeiro','Financeiro'],['honorarios','Honorários'],['admin','Administração']];

function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]});}
function fmtNum(n){return new Intl.NumberFormat('pt-PT').format(Number(n)||0);}
function fmtDate(v){if(!v)return '—';try{return new Intl.DateTimeFormat('pt-PT',{dateStyle:'medium',timeStyle:'short'}).format(new Date(v));}catch{return String(v);}}
function isAdmin(){return !!state.member&&['owner','admin'].includes(state.member.role);}
function sheetCount(name){return Number(state.meta[name]?.row_count||0);}
function statusTag(v){const s=String(v||'').toLowerCase();let tone='';if(/pago|convert|fech|realizada|sim|true/.test(s))tone='ok';else if(/pend|abert|contact|marcação|por pagar|parcial/.test(s))tone='warn';else if(/cancel|não convert|nao convert/.test(s))tone='danger';return '<span class="tag '+tone+'">'+esc(v||'—')+'</span>';}
function loginView(error){
 app.innerHTML='<div class="login"><form id="loginForm" class="login-card"><div class="tag info">ACESSO RESTRITO</div><h1>Vivus CRM</h1><p>Dados reais. Apenas utilizadores autorizados.</p><div class="field"><label>Email</label><input name="email" type="email" autocomplete="username" required></div><div class="field"><label>Password</label><input name="password" type="password" autocomplete="current-password" required></div><button class="btn primary" style="width:100%" type="submit">Entrar</button>'+(error?'<div class="login-error">'+esc(error)+'</div>':'')+'</form></div>';
 document.getElementById('loginForm').addEventListener('submit',login);
}
async function login(ev){
 ev.preventDefault();const fd=new FormData(ev.currentTarget);const btn=ev.currentTarget.querySelector('button');btn.disabled=true;btn.textContent='A entrar…';
 const {error}=await supabase.auth.signInWithPassword({email:String(fd.get('email')||'').trim(),password:String(fd.get('password')||'')});
 if(error){loginView('Não foi possível iniciar sessão. Confirma o email e a password.');return;}
 await bootstrap();
}
async function forgotPassword(){
 const email=String(document.querySelector('#loginForm input[name="email"]')?.value||'').trim();
 if(!email){loginView('Escreve primeiro o teu email.');return;}
 const {error}=await supabase.auth.resetPasswordForEmail(email,{redirectTo:APP_URL});
 if(error){loginView('Não foi possível enviar o email de recuperação: '+error.message);return;}
 loginView('Enviámos um email para definires uma nova password. Abre o link nesse email.');
}
function recoveryView(){
 app.innerHTML='<div class="login"><form id="recoveryForm" class="login-card"><div class="tag info">NOVA PASSWORD</div><h1>Vivus CRM</h1><p>Define uma nova password para continuar.</p><div class="field"><label>Nova password</label><input name="password" type="password" minlength="8" autocomplete="new-password" required></div><div class="field"><label>Confirmar password</label><input name="confirm" type="password" minlength="8" autocomplete="new-password" required></div><button class="btn primary" style="width:100%" type="submit">Guardar nova password</button></form></div>';
 document.getElementById('recoveryForm').addEventListener('submit',updateRecoveryPassword);
}
async function updateRecoveryPassword(ev){
 ev.preventDefault();
 const fd=new FormData(ev.currentTarget),password=String(fd.get('password')||''),confirm=String(fd.get('confirm')||'');
 if(password.length<8){alert('A password deve ter pelo menos 8 caracteres.');return;}
 if(password!==confirm){alert('As passwords não coincidem.');return;}
 const {error}=await supabase.auth.updateUser({password});
 if(error){alert('Não foi possível atualizar a password: '+error.message);return;}
 await supabase.auth.signOut();
 history.replaceState(null,'',APP_URL);
 alert('Password atualizada. Já podes entrar com a nova password.');
 state.session=null;state.user=null;state.member=null;loginView();
}
async function logout(){await supabase.auth.signOut();state.session=null;state.user=null;state.member=null;loginView();}
async function bootstrap(){
 app.innerHTML='<div class="loading">A carregar dados reais…</div>';
 const {data:{session}}=await supabase.auth.getSession();
 if(!session){loginView();return;}
 state.session=session;state.user=session.user;
 const {data:member,error:me}=await supabase.from('app_members').select('role,active').eq('user_id',session.user.id).maybeSingle();
 if(me||!member||!member.active){await supabase.auth.signOut();loginView('Esta conta não tem acesso ao Vivus CRM.');return;}
 state.member=member;
 await loadSyncMeta();
 render();
}
async function loadSyncMeta(){
 const {data:ss,error:e1}=await supabase.from('sheet_sync_state').select('current_run_id,last_success_at').eq('singleton',true).single();
 if(e1)throw e1;state.currentRun=ss.current_run_id;state.lastSuccess=ss.last_success_at;
 if(!state.currentRun){state.meta={};return;}
 const {data:ms,error:e2}=await supabase.from('sheet_sync_sheets').select('sheet_name,headers,row_count,column_count').eq('sync_run_id',state.currentRun);
 if(e2)throw e2;state.meta={};(ms||[]).forEach(function(x){state.meta[x.sheet_name]=x;});
}
function shell(body){
 const side=nav.map(function(n){return '<button data-nav="'+n[0]+'" class="'+(state.page===n[0]?'active':'')+'">'+esc(n[1])+'</button>';}).join('');
 return '<div class="shell"><aside class="side '+(state.menu?'open':'')+'"><div class="logo">V. <span>Vivus CRM</span></div><div class="tag ok" style="margin:0 10px 14px">DADOS REAIS · LEITURA</div><nav class="nav">'+side+'</nav><div class="side-note">Fonte: Google Sheets<br>Última sincronização: '+esc(fmtDate(state.lastSuccess))+'</div></aside><main class="main"><header class="topbar"><div><button class="btn mobile-menu" data-action="menu">☰</button> <h1 style="display:inline">'+esc(pageTitle())+'</h1></div><div class="right"><span class="user">'+esc(state.user?.email||'')+'</span><button class="btn sm" data-action="logout">Sair</button></div></header><section class="content">'+body+'</section></main></div>'+modalView();
}
function pageTitle(){if(state.page==='dashboard')return 'Dashboard';if(state.page==='admin')return 'Administração';return views[state.page]?.label||'Vivus CRM';}
function heading(title,desc,actions){return '<div class="heading"><div><h2>'+esc(title)+'</h2><p>'+esc(desc)+'</p></div><div class="right">'+(actions||'')+'</div></div>';}
function dashboard(){
 const cards=[['Entradas',sheetCount('entradas')],['Contactos',sheetCount('contactos')],['Leads',sheetCount('leads')],['Ações',sheetCount('acoes')],['Negócios',sheetCount('negocios')],['Sessões',sheetCount('sessoes')],['Pagamentos',sheetCount('pagamentos')],['Honorários',sheetCount('honorarios')]];
 return heading('Dados reais','Cópia validada do Google Sheets. Nesta fase a app não altera registos clínicos ou comerciais.')+
 '<div class="notice ok"><b>Sincronização ativa.</b> '+fmtNum(Object.values(state.meta).reduce(function(a,x){return a+Number(x.row_count||0)},0))+' linhas úteis em '+Object.keys(state.meta).length+' folhas. Atualizada em '+esc(fmtDate(state.lastSuccess))+'.</div>'+
 '<div class="grid cols4 section">'+cards.map(function(c){return '<button class="stat" data-open-sheet="'+c[0]+'" style="text-align:left;cursor:default"><span>'+esc(c[0])+'</span><strong>'+fmtNum(c[1])+'</strong></button>';}).join('')+'</div>'+
 '<section class="panel pad section"><h3>Estado desta versão</h3><p>Esta é uma versão de validação com dados reais e acesso protegido. Podes pesquisar e confirmar informação. As ações de criar, editar, apagar, marcar sessões ou registar pagamentos permanecem desligadas até validarmos a migração das relações históricas.</p></section>';
}
function rowObject(headers,values){const o={};(headers||[]).forEach(function(h,i){if(h!==''&&h!=null)o[String(h)]=values?.[i]??'';});return o;}
async function loadSheet(name){
 if(state.cache.has(name))return state.cache.get(name);
 const meta=state.meta[name];if(!meta)return [];
 state.loading=true;render();
 let all=[],from=0,size=1000;
 while(true){
   const {data,error}=await supabase.from('sheet_sync_rows').select('source_row,values_json').eq('sync_run_id',state.currentRun).eq('sheet_name',name).order('source_row',{ascending:true}).range(from,from+size-1);
   if(error){state.loading=false;throw error;}
   all=all.concat((data||[]).map(function(r){return {source_row:r.source_row,data:rowObject(meta.headers,r.values_json)};}));
   if(!data||data.length<size)break;from+=size;
 }
 state.cache.set(name,all);state.loading=false;return all;
}
function filteredRows(rows){
 const q=state.query.trim().toLowerCase();if(!q)return rows;
 return rows.filter(function(r){return Object.values(r.data).some(function(v){return String(v||'').toLowerCase().includes(q);});});
}
async function dataView(key){
 const cfg=views[key],rows=await loadSheet(cfg.sheet),filtered=filteredRows(rows),pages=Math.max(1,Math.ceil(filtered.length/state.pageSize));if(state.pageNo>pages)state.pageNo=pages;
 const start=(state.pageNo-1)*state.pageSize,part=filtered.slice(start,start+state.pageSize);
 const head=cfg.cols.map(function(c){return '<th>'+esc(c)+'</th>';}).join('')+'<th></th>';
 const body=part.map(function(r){return '<tr>'+cfg.cols.map(function(c){const v=r.data[c];return '<td>'+(c.toLowerCase().includes('estado')||c==='conversao'||c==='arquivado'||c==='registado'?statusTag(v):esc(v||'—'))+'</td>';}).join('')+'<td><button class="btn sm" data-detail="'+r.source_row+'" data-sheet="'+esc(cfg.sheet)+'">Ver</button></td></tr>';}).join('');
 return heading(cfg.label,fmtNum(filtered.length)+' registos'+(state.query?' encontrados':' na folha'))+
 '<div class="filters"><input id="search" value="'+esc(state.query)+'" placeholder="Pesquisar por nome, código, telefone, email, estado…"></div>'+
 '<section class="panel"><div class="table-wrap"><table class="table"><thead><tr>'+head+'</tr></thead><tbody>'+body+'</tbody></table>'+(part.length?'':'<div class="empty">Sem resultados.</div>')+'</div></section>'+
 '<div class="pagination"><span class="muted small">Linhas '+(filtered.length?start+1:0)+'–'+Math.min(start+state.pageSize,filtered.length)+' de '+fmtNum(filtered.length)+'</span><div class="right"><button class="btn sm" data-action="prev" '+(state.pageNo<=1?'disabled':'')+'>Anterior</button><span class="small">Página '+state.pageNo+' / '+pages+'</span><button class="btn sm" data-action="next" '+(state.pageNo>=pages?'disabled':'')+'>Seguinte</button></div></div>';
}
function admin(){
 const role=state.member?.role||'staff';
 const source='<a class="btn" href="'+SOURCE_URL+'" target="_blank" rel="noopener">Abrir Google Sheets</a>';
 const sync=isAdmin()?'<section class="panel pad section"><div class="section-head"><div><h3>Atualizar dados a partir do Sheets</h3><p class="muted small">A nova cópia só fica ativa depois de ser validada por completo.</p></div></div><div class="upload"><b>1. Descarrega a folha atual</b><p class="muted">O ficheiro XLSX é uma cópia. O Google Sheets não é alterado.</p><a class="btn" href="'+SOURCE_EXPORT+'" target="_blank" rel="noopener">Descarregar XLSX</a><div style="height:18px"></div><b>2. Carrega o ficheiro aqui</b><input id="xlsxFile" type="file" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" '+(state.syncing?'disabled':'')+'><button class="btn primary" id="syncBtn" '+(state.syncing?'disabled':'')+'>Validar e atualizar app</button><div class="section"><div class="progress"><i style="width:'+state.syncPct+'%"></i></div><p class="small muted" id="syncText">'+esc(state.syncText||'Nenhuma atualização em curso.')+'</p></div></div></section>':'<section class="panel pad section"><h3>Atualização de dados</h3><p>A atualização do Sheets está disponível apenas para administradores.</p></section>';
 return heading('Administração','Fonte, sincronização e controlo de acesso.',source)+
 '<div class="grid cols4"><div class="stat"><span>Perfil</span><strong style="font-size:18px">'+esc(role)+'</strong></div><div class="stat"><span>Folhas</span><strong>'+Object.keys(state.meta).length+'</strong></div><div class="stat"><span>Linhas</span><strong>'+fmtNum(Object.values(state.meta).reduce(function(a,x){return a+Number(x.row_count||0)},0))+'</strong></div><div class="stat"><span>Última atualização</span><strong style="font-size:14px">'+esc(fmtDate(state.lastSuccess))+'</strong></div></div>'+sync+
 '<section class="panel pad section"><h3>Proteção</h3><p>O acesso aos dados exige autenticação e pertença à lista interna do CRM. A versão de validação é só de leitura para os registos operacionais.</p></section>';
}
function modalView(){
 if(!state.detail)return '';
 const pairs=Object.entries(state.detail.data).map(function(kv){return '<div class="kv"><b>'+esc(kv[0])+'</b><div>'+esc(kv[1]||'—')+'</div></div>';}).join('');
 return '<dialog open><div class="modal-head"><h3>'+esc(state.detail.sheet)+' · linha '+state.detail.source_row+'</h3><button class="btn sm" data-action="close-detail">Fechar</button></div><div class="modal-body">'+pairs+'</div></dialog>';
}
async function render(){
 if(!state.session){loginView();return;}
 if(state.loading){app.innerHTML=shell('<div class="loading">A carregar '+esc(pageTitle())+'…</div>');bind();return;}
 let body='';
 try{if(state.page==='dashboard')body=dashboard();else if(state.page==='admin')body=admin();else body=await dataView(state.page);}
 catch(e){console.error(e);body='<div class="notice danger"><b>Não foi possível carregar os dados.</b><br>'+esc(e.message||String(e))+'</div>';}
 app.innerHTML=shell(body);bind();
}
function bind(){
 document.querySelectorAll('[data-nav]').forEach(function(el){el.addEventListener('click',function(){state.page=el.dataset.nav;state.pageNo=1;state.query='';state.menu=false;render();});});
 document.querySelectorAll('[data-action="logout"]').forEach(function(el){el.addEventListener('click',logout);});
 document.querySelectorAll('[data-action="menu"]').forEach(function(el){el.addEventListener('click',function(){state.menu=!state.menu;render();});});
 document.querySelectorAll('[data-action="prev"]').forEach(function(el){el.addEventListener('click',function(){state.pageNo=Math.max(1,state.pageNo-1);render();});});
 document.querySelectorAll('[data-action="next"]').forEach(function(el){el.addEventListener('click',function(){state.pageNo++;render();});});
 document.querySelectorAll('[data-action="close-detail"]').forEach(function(el){el.addEventListener('click',function(){state.detail=null;render();});});
 document.querySelectorAll('[data-detail]').forEach(function(el){el.addEventListener('click',async function(){const rows=await loadSheet(el.dataset.sheet);state.detail=rows.find(function(r){return String(r.source_row)===String(el.dataset.detail);})||null;render();});});
 const search=document.getElementById('search');if(search){search.addEventListener('input',function(){state.query=search.value;state.pageNo=1;window.clearTimeout(search._t);search._t=window.setTimeout(render,180);});}
 const syncBtn=document.getElementById('syncBtn');if(syncBtn)syncBtn.addEventListener('click',syncFromFile);
}
function setSync(text,pct){state.syncText=text;state.syncPct=Math.max(0,Math.min(100,pct));const t=document.getElementById('syncText');if(t)t.textContent=text;const i=document.querySelector('.progress>i');if(i)i.style.width=state.syncPct+'%';}
function valuesNonEmpty(row){return (row||[]).some(function(v){return v!==null&&v!==undefined&&String(v).trim()!=='';});}
async function syncFromFile(){
 if(!isAdmin()||state.syncing)return;
 const input=document.getElementById('xlsxFile'),file=input?.files?.[0];if(!file){alert('Escolhe primeiro o ficheiro XLSX descarregado do Google Sheets.');return;}
 state.syncing=true;setSync('A ler o ficheiro…',2);
 let runId=null;
 try{
   const XLSX=await import('https://cdn.sheetjs.com/xlsx-0.20.3/package/xlsx.mjs');
   const buf=await file.arrayBuffer();const wb=XLSX.read(buf,{type:'array',cellDates:false});
   const missing=EXPECTED_SHEETS.filter(function(s){return !wb.SheetNames.includes(s);});
   if(missing.length)throw new Error('Faltam folhas obrigatórias: '+missing.join(', '));
   runId=crypto.randomUUID();
   const {error:runErr}=await supabase.from('sheet_sync_runs').insert({id:runId,source_spreadsheet_id:SOURCE_ID,source_title:'VivusApp_Appgyver',status:'running',initiated_by:state.user.id});
   if(runErr)throw runErr;
   let done=0,total=EXPECTED_SHEETS.length;
   for(const name of EXPECTED_SHEETS){
     setSync('A importar '+name+'…',5+Math.round((done/total)*88));
     const ws=wb.Sheets[name];const matrix=XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:false,blankrows:true});
     const headers=(matrix[0]||[]).map(function(v){return v==null?'':String(v);});
     const rows=[];
     for(let i=1;i<matrix.length;i++){const row=matrix[i]||[];if(valuesNonEmpty(row))rows.push({sync_run_id:runId,sheet_name:name,source_row:i+1,values_json:row,is_current:false});}
     const {error:metaErr}=await supabase.from('sheet_sync_sheets').insert({sync_run_id:runId,sheet_name:name,headers:headers,row_count:rows.length,column_count:headers.length});
     if(metaErr)throw metaErr;
     for(let p=0;p<rows.length;p+=300){const {error:rowErr}=await supabase.from('sheet_sync_rows').insert(rows.slice(p,p+300));if(rowErr)throw rowErr;}
     done++;
   }
   setSync('A validar a nova versão…',96);
   const {data:promoted,error:promoteErr}=await supabase.rpc('promote_sheet_sync',{p_run_id:runId});
   if(promoteErr)throw promoteErr;
   state.cache.clear();await loadSyncMeta();setSync('Atualização concluída: '+fmtNum(promoted.rows)+' linhas em '+promoted.sheets+' folhas.',100);
   state.syncing=false;render();
 }catch(e){
   console.error(e);
   if(runId)await supabase.from('sheet_sync_runs').update({status:'failed',finished_at:new Date().toISOString(),error_message:String(e.message||e).slice(0,1000)}).eq('id',runId);
   state.syncing=false;setSync('Falhou: '+String(e.message||e),0);alert('A atualização não foi ativada. Os dados anteriores continuam intactos.');
 }
}
supabase.auth.onAuthStateChange(function(event,session){if(event==='PASSWORD_RECOVERY'){state.session=session;state.user=session?.user||null;recoveryView();return;}if(!session&&state.session){state.session=null;state.user=null;state.member=null;loginView();}});
bootstrap().catch(function(e){console.error(e);loginView('Não foi possível ligar ao CRM.');});
</script>
